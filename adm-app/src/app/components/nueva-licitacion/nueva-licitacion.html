<div class="licitacion-overlay" *ngIf="abierto" (click)="cerrar()">
  <div class="licitacion-dialogo" role="dialog" aria-modal="true" aria-label="Nueva licitación"
    (click)="$event.stopPropagation()">
    <form [formGroup]="form" (ngSubmit)="publicar()" novalidate>
      <header class="dialogo-head">
        <h2>Nueva licitación</h2>
        <button type="button" class="btn-icon-close" aria-label="Cerrar" (click)="cerrar()">
          <span class="material-symbols-rounded">close</span>
        </button>
      </header>

      <div class="dialogo-body">
        <div class="field full">
          <label for="nl-titulo">Título de la Licitación *</label>
          <input id="nl-titulo" formControlName="titulo" type="text"
            placeholder="Ej: Servicio de mantenimiento de grupos electrógenos" />
          <small class="text-danger" *ngIf="f['titulo'].invalid && f['titulo'].touched">
            Indica el nombre de la licitación.
          </small>
        </div>

        <div class="campo-grid">
          <div class="field">
            <label for="nl-categoria">Categoría de Servicio *</label>
            <select id="nl-categoria" formControlName="categoria_id">
              <option value="">— Selecciona una categoría —</option>
              <option *ngFor="let c of categorias" [value]="c.id">{{ c.nombre }}</option>
            </select>
            <small class="text-danger" *ngIf="f['categoria_id'].invalid && f['categoria_id'].touched">
              Elige una categoría.
            </small>
          </div>

          <div class="field">
            <label for="nl-presupuesto">Presupuesto Referencial (S/) *</label>
            <input id="nl-presupuesto" class="mono" formControlName="presupuesto_referencial"
              type="number" min="1" step="0.01" placeholder="0.00" />
            <small class="text-danger"
              *ngIf="f['presupuesto_referencial'].invalid && f['presupuesto_referencial'].touched">
              Debe ser mayor a 0.
            </small>
          </div>
        </div>

        <div class="field full">
          <label for="nl-fecha">Fecha Límite de Recepción *</label>
          <input id="nl-fecha" class="mono" formControlName="fecha_limite" type="date" />
          <small class="text-danger" *ngIf="f['fecha_limite'].invalid && f['fecha_limite'].touched">
            Define la fecha límite de recepción.
          </small>
        </div>

        <div class="field full">
          <label for="nl-descripcion">Términos de Referencia / Descripción *</label>
          <textarea id="nl-descripcion" formControlName="descripcion" rows="4"
            placeholder="Detalla los requerimientos técnicos del hotel: alcance, entregables, condiciones..."></textarea>
          <small class="text-danger" *ngIf="f['descripcion'].invalid && f['descripcion'].touched">
            Describe los términos de referencia.
          </small>
        </div>
      </div>

      <footer class="dialogo-foot">
        <button type="button" class="btn btn-ghost" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="enviando || form.invalid">
          <span class="material-symbols-rounded icon-sm">post_add</span>
          {{ enviando ? 'Publicando…' : 'Publicar Licitación' }}
        </button>
      </footer>
    </form>
  </div>
</div>
